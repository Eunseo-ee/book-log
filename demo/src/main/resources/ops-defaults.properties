# 운영 노출 기본값 (모든 프로파일). OperationsExposureConfig가 @PropertySource로 읽는다.
# application*.yml 은 이미지에 들어가지 않으므로(.dockerignore) 파일 이름을 application으로 시작하지 않는다.
# 비밀값은 넣지 않는다. 로컬 application.yml 또는 환경변수로 덮어쓸 수 있다.

# --- actuator: 기본값에 기대지 않고 health만 웹에 노출한다 ---
management.endpoints.web.exposure.include=health
# 노출과 별개로 접근 자체도 health 외에는 끈다 (노출 설정이 실수로 넓어져도 한 겹 더)
management.endpoints.access.default=none
management.endpoint.health.access=unrestricted

# health 응답은 status만. DB 종류, 디스크, 구성요소 이름이 나가지 않게 한다
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Cloud Run 등 플랫폼용 probe 그룹: /actuator/health/liveness, /actuator/health/readiness
management.endpoint.health.probes.enabled=true
# liveness: 프로세스가 살아 있는지만. DB/Redis를 보지 않는다 (외부 장애로 컨테이너가 재시작되면 안 됨)
management.endpoint.health.group.liveness.include=livenessState
# readiness: 트래픽을 받을 수 있는지. 필수 의존성인 DB만 본다. Redis는 캐시일 뿐이라 제외한다
management.endpoint.health.group.readiness.include=readinessState,db

# --- 에러 응답: 메시지/스택트레이스/예외 클래스를 본문에 싣지 않는다 (Boot 기본값이지만 고정) ---
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
