name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

# 같은 브랜치에 연달아 push하면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: demo   # Gradle 프로젝트 루트는 레포 루트가 아니라 demo/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      # git에는 gradlew가 100644(실행 권한 없음)로 저장돼 있다
      - name: Make gradlew executable
        run: chmod +x gradlew

      # DB는 서비스 컨테이너가 아니라 테스트 프로파일의 H2(src/test/resources/application-test.yml)를 쓴다.
      # PostgreSQL 쿼리 검증 테스트(ContentRepositoryPostgresTest)는 Testcontainers가 runner의 Docker로 직접 띄운다.
      # 아래 시크릿은 ApiConfig(prefix "api")의 kakaoKey / tmdbToken에 relaxed binding으로 들어간다.
      # 현재 테스트는 외부 API를 모킹하므로 값이 비어 있어도 통과한다.
      - name: Test
        run: ./gradlew test --no-daemon
        env:
          API_KAKAOKEY: ${{ secrets.KAKAO_KEY }}
          API_TMDBTOKEN: ${{ secrets.TMDB_TOKEN }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            demo/build/reports/tests
            demo/build/test-results
          retention-days: 7
