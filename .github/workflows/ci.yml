name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

# 같은 브랜치에 연달아 push하면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: demo   # Gradle 프로젝트 루트는 레포 루트가 아니라 demo/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      # git에는 gradlew가 100644(실행 권한 없음)로 저장돼 있다
      - name: Make gradlew executable
        run: chmod +x gradlew

      # (임시 진단) Postgres 테스트 skip 원인 확정용. runner의 Docker 버전/API 버전을 로그에 남긴다. 원인 확인 후 제거 (task 27)
      - name: Docker 버전 확인 (임시 진단)
        continue-on-error: true
        run: |
          docker --version || true
          docker version || true
          docker info || true

      # DB는 서비스 컨테이너가 아니라 테스트 프로파일의 H2(src/test/resources/application-test.yml)를 쓴다.
      # PostgreSQL 쿼리 검증 테스트(ContentRepositoryPostgresTest)는 Testcontainers가 runner의 Docker로 직접 띄운다.
      # 아래 시크릿은 ApiConfig(prefix "api")의 kakaoKey / tmdbToken에 relaxed binding으로 들어간다.
      # 현재 테스트는 외부 API를 모킹하므로 값이 비어 있어도 통과한다.
      - name: Test
        run: ./gradlew test --no-daemon
        env:
          API_KAKAOKEY: ${{ secrets.KAKAO_KEY }}
          API_TMDBTOKEN: ${{ secrets.TMDB_TOKEN }}

      # 테스트 합계와 Testcontainers 테스트 결과를 Job Summary에 표시 (외부 액션 없이 runner의 python3 사용)
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os
          import xml.etree.ElementTree as ET
          files = sorted(glob.glob('build/test-results/test/*.xml'))
          total = skipped = failures = errors = 0
          suites = {}
          for f in files:
              r = ET.parse(f).getroot()
              n, s, fl, er = (int(r.get(k)) for k in ('tests', 'skipped', 'failures', 'errors'))
              total += n; skipped += s; failures += fl; errors += er
              suites[r.get('name')] = (n, s, fl, er)
          target = 'book_log.demo.repository.ContentRepositoryPostgresTest'
          lines = ['## Test summary', '',
                   f'- 테스트 클래스(XML) {len(files)}개',
                   f'- 총 {total}개 실행 대상, skipped {skipped}, failures {failures}, errors {errors}']
          if target in suites:
              n, s, fl, er = suites[target]
              lines.append(f'- ContentRepositoryPostgresTest: tests={n}, skipped={s}, failures={fl}, errors={er}'
                           + (' (Docker 없이 건너뜀)' if s == n and n > 0 else ''))
          else:
              lines.append('- ContentRepositoryPostgresTest: 결과 XML 없음')
          out = chr(10).join(lines)
          print(out)
          with open(os.environ.get('GITHUB_STEP_SUMMARY', os.devnull), 'a', encoding='utf-8') as fh:
              fh.write(out + chr(10))
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            demo/build/reports/tests
            demo/build/test-results
          retention-days: 7
